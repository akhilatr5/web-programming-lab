
<html>
<head>
<title>Form Validation</title>
</head>
<body>
<form name="form" action="" onsubmit="return validateForm()">
<h1>Form Validation</h1>
<label for="fname" id="name-label">Name:</label>
<select id="title">
<option>Mr</option>
<option>Mrs</option>
<option>Ms</option>
</select>
<input type="text" id="fname" name="fname"  placeholder="Enter your name">
<br><br>
<label for="fphone" id="phone-label">Phone:</label>
<select id="country-code">
<option>+91</option>
</select>
<input type="tel" id="fphone" name="fphone" placeholder="Enter mobile number">
<br><br>
<label for="fmail" id="email-label">Email:</label>
<input type="email" id="fmail" name="fmail" placeholder="Enter Email">
<br><br>
<input type="submit" value="Submit">
</form>
<script>
function validateForm() {
var fname = document.form.fname.value.trim();
var fphone = document.form.fphone.value.trim();
var fmail = document.form.fmail.value.trim();
if (fname == "") {
alert("Enter the name");
document.form.fname.focus();
return false;
}
else if (!/^[a-zA-Z ]+$/.test(fname)) {
alert("Enter the valid name");
document.form.fname.focus();
return false;
}
if (fphone == "") {
alert("Enter the phone number");
document.form.fphone.focus();
return false;
}
else if (!/^[0-9]{10}$/.test(fphone)) {
alert("Enter the valid phone number");
document.form.fphone.focus();
return false;
}
if (fmail == "") {
alert("Enter an email");
document.form.fmail.focus();
return false;
}
else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(fmail)) {
alert("Enter a valid email");
document.form.fmail.focus();
return false;
}
return true;
}
</script>
</body>
</html>
